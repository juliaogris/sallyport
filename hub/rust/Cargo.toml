[package]
name = "sallyport-hub"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[features]
# The /spike/* endpoints. `wrangler dev` builds with them, the edge build
# does not.
spikes = []

[dependencies]
worker = "0.8.6"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["web"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
h2 = "0.4"
http = "1"
bytes = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1"
prost = "0.13"
console_error_panic_hook = "0.1"
russh = { version = "0.54.5", default-features = false, features = ["ring"] }
x509-cert = { version = "0.2", default-features = false }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# The hub is its own workspace, so the vendored crates are patched in here.
[workspace]
resolver = "2"
exclude = ["vendor"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[patch.crates-io]
russh = { path = "vendor/russh" }
internal-russh-forked-ssh-key = { path = "vendor/ssh-key" }
