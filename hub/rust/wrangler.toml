name = "sallyport-hub"
# The gmail account. Env party overrides it with the free account.
account_id = "00000000000000000000000000000000"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
# ring's C code needs a clang with a wasm32 target; Apple clang has none.
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} worker-build --release"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[vars]
CLUSTER_NAME = "sallyport"
PUBLIC_ADDR = "localhost:8787"
SERVER_VERSION = "18.11.1"
# The host auth's callout dials, which auth signs in the auth pipe
# challenge. It must match the URL auth is configured with.
CALLOUT_HOST = "localhost:8787"

# The deployment on Cloudflare: `wrangler deploy --env edge`. Secrets are
# set per env with `wrangler secret put --env edge`.
[env.edge]
# On-demand: see the lazy env below and src/lazy.rs.
main = "front.mjs"
routes = [
  { pattern = "julia.example.com", custom_domain = true },
  { pattern = "bench-julia.example.com", custom_domain = true },
  { pattern = "octo-julia.example.com", custom_domain = true },
  { pattern = "octocam-julia.example.com", custom_domain = true },
]

[env.edge.build]
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} worker-build --release"

[env.edge.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport"
PUBLIC_ADDR = "julia.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia.example.com"
# The login host is OWNER.DOMAIN and app hosts are <app>-OWNER.DOMAIN.
DOMAIN = "example.com"
OWNER = "julia"
# Apps with a launch button on the dashboard.
APPS = "bench,octo,octocam:/stream"

[[env.edge.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# Two test clusters on homesrv that compare hubs, with nothing else different:
# `wrangler deploy --env rust` and `--env go`. Each env is its own Worker,
# with its own Durable Object namespace and secrets. Both build the Rust
# hub. `--env go` from this directory replaces the Go hub that
# `hub/go/wrangler.toml` deploys.
[env.rust]
# On-demand: see the lazy env below and src/lazy.rs.
main = "front.mjs"
routes = [
  { pattern = "rust.example.com", custom_domain = true },
  { pattern = "bench-rust.example.com", custom_domain = true },
  { pattern = "octo-rust.example.com", custom_domain = true },
  { pattern = "octocam-rust.example.com", custom_domain = true },
]

[env.rust.build]
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} worker-build --release"

[env.rust.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-rust"
PUBLIC_ADDR = "rust.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "rust.example.com"
DOMAIN = "example.com"
OWNER = "rust"
APPS = "bench,octo,octocam:/stream"

[[env.rust.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[env.go]
routes = [
  { pattern = "go.example.com", custom_domain = true },
  { pattern = "bench-go.example.com", custom_domain = true },
  { pattern = "octo-go.example.com", custom_domain = true },
  { pattern = "octocam-go.example.com", custom_domain = true },
]

[env.go.build]
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} worker-build --release"

[env.go.vars]
CLUSTER_NAME = "sallyport-go"
PUBLIC_ADDR = "go.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "go.example.com"
DOMAIN = "example.com"
OWNER = "go"
APPS = "bench,octo,octocam:/stream"

[[env.go.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# The lazy hub: auth's callout keeps one hibernating control socket open and
# opens a stream per request, so the Durable Object sleeps while nobody uses
# the cluster. A JavaScript front Worker keeps each request under the free
# plan's 10 ms of CPU.
[env.lazy]
main = "front.mjs"
routes = [
  { pattern = "lazy.example.com", custom_domain = true },
  { pattern = "bench-lazy.example.com", custom_domain = true },
  { pattern = "octocam-lazy.example.com", custom_domain = true },
]

[env.lazy.build]
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} RUSTFLAGS='--cfg getrandom_backend=\"wasm_js\"' worker-build --release"

[env.lazy.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-lazy"
PUBLIC_ADDR = "lazy.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "lazy.example.com"
DOMAIN = "example.com"
OWNER = "lazy"
APPS = "bench,octocam:/stream"

[[env.lazy.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# The free-plan test: the lazy hub in a separate account on Cloudflare's
# free Workers plan, for the domain example.net.
[env.party]
account_id = "11111111111111111111111111111111"
main = "front.mjs"
routes = [
  { pattern = "julia.example.net", custom_domain = true },
  { pattern = "bench-julia.example.net", custom_domain = true },
  { pattern = "octocam-julia.example.net", custom_domain = true },
]

[env.party.build]
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} RUSTFLAGS='--cfg getrandom_backend=\"wasm_js\"' worker-build --release"

[env.party.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-party"
PUBLIC_ADDR = "julia.example.net:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia.example.net"
DOMAIN = "example.net"
OWNER = "julia"
APPS = "bench,octocam:/stream"

[[env.party.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# The free-plan comparison: the Rust lazy hub in the free account, for
# rust.example.net.
[env.party-rust]
name = "sallyport-hub-party-rust"
account_id = "11111111111111111111111111111111"
main = "front.mjs"
routes = [
  { pattern = "rust.example.net", custom_domain = true },
  { pattern = "bench-rust.example.net", custom_domain = true },
  { pattern = "octocam-rust.example.net", custom_domain = true },
]

[env.party-rust.build]
command = "CC_wasm32_unknown_unknown=${LLVM_CLANG:-/opt/homebrew/opt/llvm/bin/clang} AR_wasm32_unknown_unknown=${LLVM_AR:-/opt/homebrew/opt/llvm/bin/llvm-ar} RUSTFLAGS='--cfg getrandom_backend=\"wasm_js\"' worker-build --release"

[env.party-rust.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-party-rust"
PUBLIC_ADDR = "rust.example.net:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "rust.example.net"
DOMAIN = "example.net"
OWNER = "rust"
APPS = "bench,octocam:/stream"

[[env.party-rust.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"
