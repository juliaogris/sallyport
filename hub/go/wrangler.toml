# The Go hub.
#
# `wrangler deploy` with no env goes to the throwaway dev Worker on
# workers.dev, which has no routes. `wrangler deploy --env go` replaces the
# Worker behind go.example.com. The go env is the Rust hub's go env, with the
# same Worker name, routes, vars, secrets and Durable Object class, so the
# go test cluster on homesrv needs no change. To go back to the Rust hub, run
# `npx wrangler@4 deploy --env go` in the Rust hub's directory.
name = "julia-sallyport-gohub-dev"
# The gmail account, so that wrangler does not ask when a login sees two.
account_id = "00000000000000000000000000000000"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[build]
command = "./build.sh"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# The dev Worker's own host is its login host, so the login routes answer
# there. Its secrets are the go cluster's, and CALLOUT_HOST is its own host,
# so only a callout that signs for this host gets in.
[vars]
CLUSTER_NAME = "sallyport-go"
PUBLIC_ADDR = "julia-sallyport-gohub-dev.example.workers.dev:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia-sallyport-gohub-dev.example.workers.dev"
DOMAIN = "example.workers.dev"
OWNER = "julia-sallyport-gohub-dev"
APPS = "bench,octo,octocam:/stream"

# julia.example.com, on the gmail account. The Worker is the one the Rust hub's
# edge env deployed, so its secrets and Durable Object class carry over and
# the auth cluster on homesrv needs no change. To go back to the Rust hub, run
# `npx wrangler@4 deploy --env edge` in the Rust hub's directory.
[env.edge]
name = "sallyport-hub-edge"
routes = [
  { pattern = "julia.example.com", custom_domain = true },
  { pattern = "bench-julia.example.com", custom_domain = true },
  { pattern = "octo-julia.example.com", custom_domain = true },
  { pattern = "octocam-julia.example.com", custom_domain = true },
]

[env.edge.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport"
PUBLIC_ADDR = "julia.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia.example.com"
DOMAIN = "example.com"
OWNER = "julia"
APPS = "bench,octo,octocam:/stream"

[[env.edge.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# julia.example.net, on the free account. The Worker is the one the Rust
# hub's party env deployed, as for edge. The free plan allows about one
# always-connected hub a day of Durable Object time, so this is the only hub
# on that account.
[env.party]
name = "sallyport-hub-party"
account_id = "11111111111111111111111111111111"
routes = [
  { pattern = "julia.example.net", custom_domain = true },
  { pattern = "bench-julia.example.net", custom_domain = true },
  { pattern = "octo-julia.example.net", custom_domain = true },
  { pattern = "octocam-julia.example.net", custom_domain = true },
]

[env.party.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-party"
PUBLIC_ADDR = "julia.example.net:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia.example.net"
DOMAIN = "example.net"
OWNER = "julia"
APPS = "bench,octo,octocam:/stream"

[[env.party.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[env.go]
name = "sallyport-hub-go"
routes = [
  { pattern = "go.example.com", custom_domain = true },
  { pattern = "bench-go.example.com", custom_domain = true },
  { pattern = "octo-go.example.com", custom_domain = true },
  { pattern = "octocam-go.example.com", custom_domain = true },
]

[env.go.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-go"
PUBLIC_ADDR = "go.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "go.example.com"
DOMAIN = "example.com"
OWNER = "go"
APPS = "bench,octo,octocam:/stream"

[[env.go.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# The free-plan comparison: the Go lazy hub in the free account, for
# go.example.net.
[env.party-go]
name = "sallyport-hub-party-go"
account_id = "11111111111111111111111111111111"
routes = [
  { pattern = "go.example.net", custom_domain = true },
  { pattern = "bench-go.example.net", custom_domain = true },
  { pattern = "octo-go.example.net", custom_domain = true },
  { pattern = "octocam-go.example.net", custom_domain = true },
]

[env.party-go.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-party-go"
PUBLIC_ADDR = "go.example.net:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "go.example.net"
DOMAIN = "example.net"
OWNER = "go"
APPS = "bench,octo,octocam:/stream"

[[env.party-go.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"
