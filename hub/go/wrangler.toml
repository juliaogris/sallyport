# The Go hub. Each env is one deployment. Set your own values in the home
# env below, or in a copy of this file in this directory, and deploy with:
#
#   npx wrangler@4 deploy --env home
#   npx wrangler@4 deploy -c <copy>.toml --env home
#
# A copy must stay in this directory, because wrangler finds main and the
# build command relative to the config file.
#
# Always pass an env. Without one, wrangler deploys a Worker with this
# name, no routes and no vars.
name = "sallyport-hub"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[build]
command = "./build.sh"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# An example deployment. The login host is OWNER.DOMAIN, here
# me.example.com, and each app is at <app>-OWNER.DOMAIN, or at
# <app>.OWNER.DOMAIN when it is in SUB_APPS. Every host needs a route, and
# DOMAIN must be a zone in the Cloudflare account.
[env.home]
name = "sallyport-hub-home"
# Your Cloudflare account ID, from the dashboard or `npx wrangler@4 whoami`.
account_id = "YOUR_ACCOUNT_ID"
routes = [
  { pattern = "me.example.com", custom_domain = true },
  { pattern = "printer-me.example.com", custom_domain = true },
]

[env.home.vars]
HUB_MODE = "lazy"
# The cluster_name in the auth service's teleport.yaml.
CLUSTER_NAME = "home"
PUBLIC_ADDR = "me.example.com:443"
# The Teleport version of the fork.
SERVER_VERSION = "18.11.1"
# The host in the auth service's callout_to URL.
CALLOUT_HOST = "me.example.com"
DOMAIN = "example.com"
OWNER = "me"
# The apps on the dashboard, comma-separated. An app may have a start path
# after a colon, such as cam:/stream.
APPS = "printer"
# The apps in APPS to serve at <app>.OWNER.DOMAIN, under the login host,
# comma-separated. A web UI that logs in with a passkey must be under the
# login host, the WebAuthn relying party.
# SUB_APPS = ""

[[env.home.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"
