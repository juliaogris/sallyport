# The Go hub. Each env is one deployment:
#
#   npx wrangler@4 deploy --env edge    # julia.example.com, gmail account
#   npx wrangler@4 deploy --env party   # julia.example.net, free account
#
# Always pass an env. Without one, wrangler deploys a Worker with this
# name, no routes and no vars.
name = "sallyport-hub"
# The gmail account, so that wrangler does not ask when a login sees two.
account_id = "00000000000000000000000000000000"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[build]
command = "./build.sh"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# julia.example.com, on the gmail account, for the auth cluster in
# deploy/homesrv.
[env.edge]
name = "sallyport-hub-edge"
routes = [
  { pattern = "julia.example.com", custom_domain = true },
  { pattern = "bench-julia.example.com", custom_domain = true },
  { pattern = "octo-julia.example.com", custom_domain = true },
  { pattern = "octocam-julia.example.com", custom_domain = true },
]

[env.edge.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport"
PUBLIC_ADDR = "julia.example.com:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia.example.com"
DOMAIN = "example.com"
OWNER = "julia"
APPS = "bench,octo,octocam:/stream"

[[env.edge.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# julia.example.net, on the free account, for the cluster in
# deploy/homesrv-party. The free plan's daily Durable Object time is enough for
# one hub, so this is the only hub on that account.
[env.party]
name = "sallyport-hub-party"
account_id = "11111111111111111111111111111111"
routes = [
  { pattern = "julia.example.net", custom_domain = true },
  { pattern = "bench-julia.example.net", custom_domain = true },
  { pattern = "octo-julia.example.net", custom_domain = true },
  { pattern = "octocam-julia.example.net", custom_domain = true },
]

[env.party.vars]
HUB_MODE = "lazy"
CLUSTER_NAME = "sallyport-party"
PUBLIC_ADDR = "julia.example.net:443"
SERVER_VERSION = "18.11.1"
CALLOUT_HOST = "julia.example.net"
DOMAIN = "example.net"
OWNER = "julia"
APPS = "bench,octo,octocam:/stream"

[[env.party.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"
