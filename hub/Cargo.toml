[package]
name = "sallyport-hub"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8.6"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["web"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
base64 = "0.22"
serde_json = "1"
h2 = "0.4"
http = "1"
bytes = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1"
prost = "0.13"
console_error_panic_hook = "0.1"
russh = { version = "0.54.5", default-features = false, features = ["ring"] }
