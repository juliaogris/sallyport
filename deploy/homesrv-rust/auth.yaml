# Auth for the rust test cluster on homesrv, calling out to the hub on rust.example.com.
version: v3
teleport:
  nodename: sallyport-rust-auth
  data_dir: /home/julia/sallyport-rust/data/auth
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: true
  cluster_name: sallyport-rust
  listen_addr: 127.0.0.1:3126
  proxy_protocol: off
  proxy_listener_mode: multiplex
  callout_to: wss://rust.example.com/tunnel/auth
  callout_key_file: /home/julia/sallyport-rust/callout.pem
  # A hub deploy drops the agent's tunnel, and the agent only notices at its
  # next keepalive. The default is 5 minutes, up to 15 with retries.
  keep_alive_interval: 30s
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: rust.example.com
proxy_service:
  enabled: false
ssh_service:
  enabled: false
