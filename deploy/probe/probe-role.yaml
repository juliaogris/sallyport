# The role of the probe user in each cluster. It can open every app and
# nothing else. The user certs the renew script signs, and so the app
# sessions, last 24 hours, under max_session_ttl.
kind: role
version: v7
metadata:
  name: probe
spec:
  options:
    max_session_ttl: 30h
  allow:
    app_labels:
      '*': '*'
