# The app service on homesrv, reaching the deployed hub on julia.example.com.
version: v3
teleport:
  nodename: sallyport-app
  data_dir: /home/julia/sallyport/data/app
  proxy_server: julia.example.com:443
  join_params:
    method: token
    token_name: joined-already
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: false
proxy_service:
  enabled: false
ssh_service:
  enabled: false
app_service:
  enabled: true
  apps:
  - name: octo
    uri: http://octo.lan
    public_addr: octo-julia.example.com
    labels:
      sallyport-spike: s4
      # The deny-octo role matches this label.
      sallyport-app: octo
  # S4 spike: a local static server with index.html and a 10 MB file.
  - name: bench
    uri: http://127.0.0.1:18080
    public_addr: bench-julia.example.com
    labels:
      sallyport-spike: s4
  # The OctoPrint webcam through ~/sallyport/bin/octocam, which serves /snapshot and
  # /stream on the loopback address.
  - name: octocam
    uri: http://127.0.0.1:18081
    public_addr: octocam-julia.example.com
    labels:
      sallyport-spike: s4
