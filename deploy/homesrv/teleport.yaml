# The julia cluster on homesrv in on-demand mode: auth and the app service in
# one fork process. Auth calls out to the hub on julia.example.com, and the
# app service serves through the callout, with no reverse tunnel. The LAN
# proxy (proxy.yaml) still serves the web UI, but it cannot reach the
# apps, since there is no tunnel.
# Auth on homesrv, calling out to the deployed hub on julia.example.com.
version: v3
teleport:
  nodename: sallyport-auth
  data_dir: /home/julia/sallyport/data/auth
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: true
  cluster_name: sallyport
  listen_addr: 127.0.0.1:3025
  proxy_protocol: off
  proxy_listener_mode: multiplex
  callout_to: wss://julia.example.com/tunnel/auth
  callout_key_file: /home/julia/sallyport/callout.pem
  callout_mode: on_demand
  # A hub deploy drops the agent's tunnel, and the agent only notices at its
  # next keepalive. The default is 5 minutes, up to 15 with retries.
  keep_alive_interval: 30s
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: julia.example.com
proxy_service:
  enabled: false
ssh_service:
  enabled: false
app_service:
  enabled: true
  apps:
  - name: octo
    uri: http://octo.lan
    public_addr: octo-julia.example.com
    # OctoPrint accepts a WebSocket only when its Origin matches the Host
    # header and X-Scheme, and the app service sends Host: octo.lan.
    rewrite:
      headers:
      - "Host: octo-julia.example.com"
      - "X-Scheme: https"
    labels:
      sallyport-spike: s4
      # The deny-octo role matches this label.
      sallyport-app: octo
  # S4 spike: a local static server with index.html and a 10 MB file.
  - name: bench
    uri: http://127.0.0.1:18080
    public_addr: bench-julia.example.com
    labels:
      sallyport-spike: s4
  # The OctoPrint webcam through ~/sallyport/bin/octocam, which serves /snapshot and
  # /stream on the loopback address.
  - name: octocam
    uri: http://127.0.0.1:18081
    public_addr: octocam-julia.example.com
    labels:
      sallyport-spike: s4
