# The lazy test cluster on homesrv: auth and the app service in one fork
# process. Auth calls out to the hub on lazy.example.com in on-demand mode,
# and the app service serves through the callout, with no reverse tunnel.
version: v3
teleport:
  nodename: sallyport-lazy
  data_dir: /home/julia/sallyport-lazy/data
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: true
  cluster_name: sallyport-lazy
  listen_addr: 127.0.0.1:3326
  proxy_protocol: off
  proxy_listener_mode: multiplex
  callout_to: wss://lazy.example.com/tunnel/auth
  callout_key_file: /home/julia/sallyport-lazy/callout.pem
  callout_mode: on_demand
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: lazy.example.com
proxy_service:
  enabled: false
ssh_service:
  enabled: false
app_service:
  enabled: true
  apps:
  # A local static server with index.html and a 10 MB file.
  - name: bench
    uri: http://127.0.0.1:18380
    public_addr: bench-lazy.example.com
  # The OctoPrint webcam, through julia's relay on 127.0.0.1:18081.
  - name: octocam
    uri: http://127.0.0.1:18081
    public_addr: octocam-lazy.example.com
