# The party-rust test cluster on homesrv, for the free-plan comparison: auth and the app
# service in one fork process. Auth calls out to the hub on
# rust.example.net in on-demand mode, in a separate Cloudflare account on
# the free Workers plan, and the app service serves through the callout.
version: v3
teleport:
  nodename: sallyport-party-rust
  data_dir: /home/julia/sallyport-party-rust/data
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: true
  cluster_name: sallyport-party-rust
  listen_addr: 127.0.0.1:3526
  proxy_protocol: off
  proxy_listener_mode: multiplex
  callout_to: wss://rust.example.net/tunnel/auth
  callout_key_file: /home/julia/sallyport-party-rust/callout.pem
  callout_mode: on_demand
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: rust.example.net
proxy_service:
  enabled: false
ssh_service:
  enabled: false
app_service:
  enabled: true
  apps:
  # A local static server with index.html and a 10 MB file.
  - name: bench
    uri: http://127.0.0.1:18580
    public_addr: bench-rust.example.net
  # OctoPrint on the LAN.
  - name: octo
    uri: http://octo.lan
    public_addr: octo-rust.example.net
  # The OctoPrint webcam, through julia's relay on 127.0.0.1:18081.
  - name: octocam
    uri: http://127.0.0.1:18081
    public_addr: octocam-rust.example.net
