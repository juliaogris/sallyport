# S3 spike: stock v18.10.0 app service. app-join.yaml joins once against
# auth directly; app-tunnel.yaml then reaches auth only through the hub.
version: v3
teleport:
  nodename: sallyport-app
  data_dir: ../../../.local/data/app
  proxy_server: localhost:8787
  join_params:
    method: token
    token_name: joined-already
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: false
proxy_service:
  enabled: false
ssh_service:
  enabled: false
app_service:
  enabled: true
  apps:
  - name: octoprint
    uri: http://octo.local
    public_addr: octo-julia.example.com
    labels:
      sallyport-spike: s4
  # S4 spike: a local static server with index.html and a 10 MB file.
  - name: bench
    uri: http://127.0.0.1:18080
    public_addr: bench-julia.example.com
    labels:
      sallyport-spike: s4
