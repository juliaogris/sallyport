# S3 spike: the reference Go proxy, v18.10.0. Used for the app service's
# first join and as the oracle to diff the hub against.
version: v3
teleport:
  nodename: sallyport-ref-proxy
  data_dir: ../../../.local/data/proxy
  auth_server: 127.0.0.1:3025
  join_params:
    method: token
    token_name: JOIN_TOKEN
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: false
ssh_service:
  enabled: false
proxy_service:
  enabled: true
  web_listen_addr: 127.0.0.1:3080
  public_addr: localhost:3080
  https_keypairs:
  - key_file: ../../../.local/https/localhost-key.pem
    cert_file: ../../../.local/https/localhost.pem
