# S3 spike: a local auth service, v18.10.0, reachable on localhost only.
version: v3
teleport:
  nodename: sallyport-auth
  data_dir: ../../../.local/data/auth
  log:
    output: stderr
    severity: DEBUG
auth_service:
  enabled: true
  cluster_name: sallyport
  listen_addr: 127.0.0.1:3025
  proxy_protocol: off
  authentication:
    type: local
    second_factor: "on"
    webauthn:
      rp_id: localhost
proxy_service:
  enabled: false
ssh_service:
  enabled: false
