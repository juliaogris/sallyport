# Vendored from crates.io russh 0.54.5 and patched. See PATCHES.md.

# This crate is its own workspace so that `cargo test` works in this directory.
[workspace]

[package]
edition = "2021"
rust-version = "1.75"
name = "russh"
version = "0.54.5"
authors = ["Pierre-Étienne Meunier <pe@pijul.org>"]
build = false
autobins = false
autotests = false
description = "A client and server SSH library."
homepage = "https://github.com/warp-tech/russh"
documentation = "https://docs.rs/russh"
readme = "README.md"
keywords = ["ssh"]
license = "Apache-2.0"
repository = "https://github.com/warp-tech/russh"

[package.metadata.docs.rs]
all-features = true

[lib]
name = "russh"
path = "src/lib.rs"

[[test]]
name = "test_backpressure"
path = "tests/test_backpressure.rs"

[[test]]
name = "test_data_stream"
path = "tests/test_data_stream.rs"

[[test]]
name = "test_rekey_strict_kex"
path = "tests/test_rekey_strict_kex.rs"

[[test]]
name = "teleport_hooks"
path = "tests/teleport_hooks.rs"

[dependencies.aes]
version = "0.8"

[dependencies.async-trait]
version = "0.1.50"
optional = true

[dependencies.aws-lc-rs]
version = "1.13.1"
optional = true

[dependencies.base64ct]
version = "~1.6"

[dependencies.bitflags]
version = "2.0"

[dependencies.block-padding]
version = "0.3"
features = ["std"]

[dependencies.byteorder]
version = "1.4"

[dependencies.bytes]
version = "1.7"

[dependencies.cbc]
version = "0.1"

[dependencies.criterion]
version = "0.3"
features = ["html_reports"]
optional = true

[dependencies.ctr]
version = "0.9"

[dependencies.curve25519-dalek]
version = "4.1.3"

[dependencies.data-encoding]
version = "2.3"

[dependencies.delegate]
version = "0.13"

[dependencies.der]
version = "0.7"

[dependencies.des]
version = "0.8.1"
optional = true

[dependencies.digest]
version = "0.10"

[dependencies.ecdsa]
version = "0.16"

[dependencies.ed25519-dalek]
version = "2.0"
features = [
    "rand_core",
    "pkcs8",
]

[dependencies.elliptic-curve]
version = "0.13"
features = ["ecdh"]

[dependencies.enum_dispatch]
version = "0.3.13"

[dependencies.flate2]
version = "1.0.15"
optional = true

[dependencies.futures]
version = "0.3"

[dependencies.generic-array]
version = "0.14"

[dependencies.getrandom]
version = "0.2.15"
features = ["js"]

[dependencies.hex-literal]
version = "0.4"

[dependencies.hmac]
version = "0.12"

[dependencies.inout]
version = "0.1"
features = ["std"]

[dependencies.log]
version = "0.4.11"

[dependencies.md5]
version = "0.7"

[dependencies.num-bigint]
version = "0.4.2"
features = ["rand"]

[dependencies.once_cell]
version = "1.13"

[dependencies.p256]
version = "0.13"
features = ["ecdh"]

[dependencies.p384]
version = "0.13"
features = ["ecdh"]

[dependencies.p521]
version = "0.13"
features = ["ecdh"]

[dependencies.pbkdf2]
version = "0.12"

[dependencies.pkcs1]
version = "0.7"
optional = true

[dependencies.pkcs5]
version = "0.7"

[dependencies.pkcs8]
version = "0.10"
features = [
    "pkcs5",
    "encryption",
]

[dependencies.rand]
version = "0.8"

[dependencies.rand_core]
version = "0.6.4"
features = [
    "getrandom",
    "std",
]

[dependencies.ring]
version = "0.17.14"
optional = true

[dependencies.rsa]
version = "0.9"
optional = true

[dependencies.russh-cryptovec]
version = "0.52.0"
features = ["ssh-encoding"]

[dependencies.russh-util]
version = "0.52.0"

[dependencies.sec1]
version = "0.7"
features = [
    "pkcs8",
    "der",
]

[dependencies.sha1]
version = "0.10.5"
features = ["oid"]

[dependencies.sha2]
version = "0.10.6"
features = ["oid"]

[dependencies.signature]
version = "2.2"

[dependencies.spki]
version = "0.7"

[dependencies.ssh-encoding]
version = "0.2"
features = ["bytes"]

[dependencies.ssh-key]
version = "=0.6.11"
features = [
    "ed25519",
    "p256",
    "p384",
    "p521",
    "encryption",
    "ppk",
    "hazmat-allow-insecure-rsa-keys",
]
package = "internal-russh-forked-ssh-key"

[dependencies.subtle]
version = "2.4"

[dependencies.thiserror]
version = "1.0.30"

[dependencies.tokio]
version = "1.17.0"
features = [
    "io-util",
    "sync",
    "time",
]

[dependencies.typenum]
version = "1.17"

[dependencies.yasna]
version = "0.5.0"
features = [
    "bit-vec",
    "num-bigint",
]
optional = true

[dependencies.zeroize]
version = "1.7"

[dev-dependencies.anyhow]
version = "1.0.4"

[dev-dependencies.env_logger]
version = "0.6"

[dev-dependencies.rand]
version = "0.8.5"

[dev-dependencies.tempfile]
version = "3.14.0"

[dev-dependencies.tokio]
version = "1.17.0"
features = [
    "io-std",
    "io-util",
    "rt-multi-thread",
    "time",
    "net",
    "sync",
    "macros",
    "process",
]

[features]
_bench = ["dep:criterion"]
async-trait = ["dep:async-trait"]
aws-lc-rs = ["dep:aws-lc-rs"]
default = [
    "flate2",
    "aws-lc-rs",
    "rsa",
]
des = ["dep:des"]
dsa = ["ssh-key/dsa"]
legacy-ed25519-pkcs8-parser = ["yasna"]
ring = ["dep:ring"]
rsa = [
    "dep:rsa",
    "dep:pkcs1",
    "ssh-key/rsa",
    "ssh-key/rsa-sha1",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.home]
version = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1.17.0"
features = [
    "io-util",
    "rt-multi-thread",
    "time",
    "net",
]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1.17.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio-stream]
version = "0.1.3"
features = [
    "net",
    "sync",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-time]
version = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies.gloo-timers]
version = "0.3"
features = ["futures"]

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target."cfg(windows)".dependencies.pageant]
version = "0.1"
